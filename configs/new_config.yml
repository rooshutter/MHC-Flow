# Logging Traing only
logdir: "./checkpoints/fold_1_t_1000_e_100_test"
project: 'Structur_prediction_Experiments'
run_name: 'pmhc_8K_xray_diff_t_1000_e_100_test'
entity: 'roos-hutter-university-of-amsterdam' #'neuro-ai-scientist'

resume: False 

# Training
num_epochs: 100 #1000 # TODO: early stopping?? -> prevent overfitting
device: 'cuda'
gpus: 1

batch_size: 32
lr: 5.0e-4
num_workers: 18
all_atom: False
wandb_log: False

# Task
task_params:
  features_fixed: True
  confidence_score: False

# Dataset
data_dir: "/home/rhutter/MHC-Diff/data/pmhc_xray_8K_aligned/folds/fold_1/" #"/scratch-shared/roos/preprocessed/" 
dataset: 'pmhc_8K_xray'
dataset_params:
  num_atoms: 20
  num_residues: 20
  norm_values: [1,1]

generative_model: 'conditional_diffusion'
generative_model_params:
  timesteps: 1000
  position_encoding: True
  position_encoding_dim: 10
  com_handling: 'peptide' # 'protein' 'both' 'peptide' 'no_COM'
  sampling_stepsize: 1
  noise_scaling: null
  high_noise_training: False


architecture: 'egnn'
network_params: 
  # general network parameters
  conditioned_on_time: True
  joint_dim: 32
  hidden_dim: 64
  num_layers: 3
  # edges
  edge_embedding_dim: 8
  edge_cutoff_ligand: null
  edge_cutoff_pocket: 8.0
  edge_cutoff_interaction: 14.0
  # egnn specific
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: True
  normalization_factor: 100
  aggregation_method: 'sum'
  reflection_equivariant: False

# Eval
checkpoint: './checkpoints/fold_1_t_1000_e_100_test/checkpoints/best-model-epoch=epoch=94.ckpt' 
num_samples: 10
sample_batch_size: 10
sampling_without_noise: False
sample_savepath: './results/rmse_values/diffusion/fold_1_t_1000_e_100_test/samples_test'





















